ount{margin:18px 0;padding:18px;border-radius:15px;background:#f2faf7;text-align:center}.count strong{font-size:29px}.count span{color:#74858a;font-size:12px}.stats{display:grid;gap:11px;padding:15px 0;border-top:1px solid #e9f0f2;border-bottom:1px solid #e9f0f2}.stat{display:grid;grid-template-columns:9px 1fr auto;gap:8px;align-items:center;color:#63747a;font-size:12px}.stat b{color:#223e41}.dot{width:8px;height:8px;border-radius:50%}.green{background:#17a874}.red{background:#e14858}.gray{background:#b7c6cc}.blue-dot{background:var(--blue)}.side .primary{width:100%;margin-top:18px}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.heading h1{margin:5px 0 0;font-size:27px}.answered-badge{padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#ffffffbd;color:#607279;font-size:12px;font-weight:700}.question{margin-bottom:16px;padding:26px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 9px 26px #2558670f}.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.qnum{padding:5px 9px;border-radius:8px;color:#fff;background:var(--green);font-size:12px;font-weight:800}.source{color:#85939a;font-size:11px}.result{margin-left:auto;font-size:12px;font-weight:750}.result.ok{color:var(--green)}.result.bad{color:var(--red)}.result.empty{color:#77868c}.question h2{margin:17px 0 20px;font-size:17px;line-height:1.58}.answers{display:grid;gap:9px}.answer{width:100%;min-height:52px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;padding:10px 14px;border:1px solid #dce8ed;border-radius:13px;color:#273d42;background:#fbfdfe;text-align:left;cursor:pointer}.answer:hover:not(:disabled){border-color:#87cbb7;background:#f4fcf9}.answer:disabled{cursor:default;opacity:1}.letter{width:30px;height:30px;display:grid;place-items:center;border:1px solid #d8e5e9;border-radius:8px;background:#fff;color:#61747b;font-size:12px;font-weight:800}.answer.selected{border-color:#70b9d7;background:#eaf7fd;box-shadow:inset 3px 0 var(--blue);color:#145d7c}.selected .letter{border-color:var(--blue);background:var(--blue);color:#fff}.answer.correct{border-color:#74c9aa;background:#e3f7ef;box-shadow:inset 3px 0 #10a371;color:#075d43}.correct .letter{border-color:#0d9e70;background:#0d9e70;color:#fff}.answer.wrong{border-color:#f1aab3;background:#fff0f2;box-shadow:inset 3px 0 #e04455;color:#8c2433}.wrong .letter{border-color:#df4052;background:#df4052;color:#fff}.end{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px;padding:21px 23px;border:1px dashed #8ecdb9;border-radius:18px;background:#f4fcf9}.end strong,.end span{display:block}.end span{margin-top:3px;color:#697b7f;font-size:12px}.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:#172f3475}.modal-card{width:min(500px,100%);padding:27px;border-radius:21px;background:#fff;box-shadow:0 25px 70px #0003}.modal-card h2{margin:0 0 8px}.modal-card p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.plain{border:1px solid var(--line);background:#fff;color:#42555b}.score{text-align:center;padding:20px;border-radius:17px;background:linear-gradient(135deg,#e7f7f1,#f0f9ff)}.score span,.score small{display:block;color:#637579}.score strong{display:block;color:var(--green);font-size:54px;line-height:1.05}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.result-grid div{padding:12px 7px;border:1px solid #e4edef;border-radius:13px;text-align:center}.result-grid b,.result-grid span{display:block}.result-grid span{margin-top:3px;color:#748287;font-size:10px}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:repeat(3,1fr);border:0;padding:0}.count,.side h3,.side .primary{display:none}}@media(max-width:640px){.home{padding:12px}.home-card{padding:27px 20px;border-radius:23px}.intro{margin-top:34px}.intro h1{font-size:39px}.modes{grid-template-columns:1fr}.mode p{min-height:0}.top-inner{height:66px}.timer small,.mini span{display:none}.layout{width:calc(100% - 18px);padding-top:15px}.heading{align-items:start}.heading h1{font-size:22px}.question{padding:19px 15px}.question h2{font-size:15px}.result{width:100%;margin-left:0}.end{grid-template-columns:auto 1fr}.end button{grid-column:1/-1}.modal-actions{display:grid}.result-grid{gap:5px}}

<script>
const BANK=[{"id":1,"question":"Quốc hội quyết định lấy tên nước Cộng hòa XHCN Việt Nam từ ngày, tháng, năm nào?","options":["02/7/1976.","02/7/1975.","02/7/1977."],"correctAnswer":0},{"id":2,"question":"Câu nói “Các Vua Hùng đã có công dựng nước thì Bác cháu ta phải cùng nhau giữ lấy nước” được Bác Hồ nói ở đâu?","options":["Đền Hùng.","Chiến khu Việt Bắc.","Đại hội Đoàn toàn quốc lần thứ III."],"correctAnswer":0},{"id":3,"question":"Chiến dịch Điện Biên Phủ diễn ra thời gian nào?","options":["Từ ngày 13/3 đến 07/5/1954.","Từ ngày 15/3 đến 08/5/1954.","Từ ngày 11/3 đến 07/5/1954."],"correctAnswer":0},{"id":4,"question":"Chiến dịch Hồ Chí Minh lịch sử diễn ra thời gian nào?","options":["Từ ngày 26 đến 30/4/1975.","Từ ngày 25 đến 30/4/1975.","Từ ngày 24 đến 30/4/1975."],"correctAnswer":0},{"id":5,"question":"Quan điểm “Thanh niên là trụ cột của nước nhà, chủ nhân tương lai của đất nước, là lực lượng xung kích trong xây dựng và bảo vệ Tổ quốc, một trong những nhân tố quyết định sự thành bại của sự nghiệp công nghiệp hóa, hiện đại hóa đất nước, hội nhập quốc tế và xây dựng chủ nghĩa xã hội. Thanh niên được đặt ở vị trí trung tâm trong chiến lược bồi dưỡng, phát huy nhân tố và nguồn lực con người. Chăm lo, phát triển thanh niên vừa là mục tiêu, vừa là động lực đảm bảo cho sự ổn định và phát triển bền vững của đất nước” được Đảng xác định trong Nghị quyết nào?","options":["Nghị quyết Hội nghị lần thứ 7 Ban Chấp hành Trung ương Đảng khóa X.","Nghị quyết Hội nghị lần thứ 8 Ban Chấp hành Trung ương Đảng khóa X.","Nghị quyết Hội nghị lần thứ 9 Ban Chấp hành Trung ương Đảng khóa X."],"correctAnswer":0},{"id":6,"question":"Nội dung nào của Chỉ thị số 42-CT/TW, ngày 24/3/2015 của Ban Bí thư Trung ương Đảng (khoá XI)?","options":["“Tăng cường sự lãnh đạo của Đảng đối với công tác giáo dục lý tưởng cách mạng, đạo đức, lối sống văn hoá cho thế hệ trẻ giai đoạn 2015 - 2030”.","“Tăng cường sự lãnh đạo của Đảng đối với công tác giáo dục đạo đức, lối sống cho thanh niên giai đoạn 2015 - 2020”.","“Tăng cường sự lãnh đạo của Đảng đối với công tác giáo dục lý tưởng cách mạng, đạo đức, lối sống văn hoá cho thế hệ trẻ giai đoạn 2015 - 2020”."],"correctAnswer":0},{"id":7,"question":"Quan điểm chỉ đạo “Xây dựng Đoàn vững mạnh là nội dung quan trọng trong công tác xây dựng Đảng, là xây dựng Đảng trước một bước” được Ban Chấp hành Trung ương Đảng khóa X xác định tại Nghị quyết số bao nhiêu, ngày, tháng, năm nào?","options":["Nghị quyết số 25-NQ/TW, ngày 25/7/2008.","Nghị quyết số 25-NQ/TW, ngày 24/7/2008.","Nghị quyết số 25-NQ/TW, ngày 23/7/2008."],"correctAnswer":0},{"id":8,"question":"Điều lệ Đảng Cộng sản Việt Nam khoá XI quy định Đảng lãnh đạo Đoàn Thanh niên Cộng sản Hồ Chí Minh tại Chương nào?","options":["Chương X.","Chương IX.","Chương XI."],"correctAnswer":0},{"id":9,"question":"Những người nào được gọi là cử tri?","options":["Công dân nước Cộng hoà xã hội chủ nghĩa Việt Nam - là người có quốc tịch Việt Nam, tính đến ngày bầu cử đủ 18 tuổi trở lên và có đủ các điều kiện theo quy định của pháp luật về bầu cử.","Là người Việt Nam đủ 18 tuổi trở lên.","Là người Việt Nam, tính đến ngày bầu cử đủ 18 tuổi trở lên và có đủ các điều kiện theo quy định của pháp luật về bầu cử."],"correctAnswer":0},{"id":10,"question":"Đại hội XIV của Đảng diễn ra vào thời gian nào? Tại đâu?","options":["Từ ngày 19/01/2026 đến 23/01/2026 tại Hà Nội.","Từ ngày 18/01/2026 đến 21/01/2026 tại Hà Nội.","Từ ngày 19/01/2026 đến 22/01/2026 tại Hà Nội."],"correctAnswer":0},{"id":11,"question":"Phương châm Đại hội lần thứ XIV của Đảng?","options":["“Đoàn kết - Dân chủ - Kỷ cương - Đột phá - Phát triển”.","“Đoàn kết - Sáng tạo - Dân chủ - Kỷ cương - Phát triển”.","“Dân chủ - Đoàn kết - Sáng tạo - Phát triển - Kỷ cương”."],"correctAnswer":0},{"id":12,"question":"Nghị quyết Đại hội XIV của Đảng xác định bao nhiêu đột phá chiến lược?","options":["3 đột phá.","4 đột phá.","5 đột phá."],"correctAnswer":0},{"id":13,"question":"Nghị quyết Đại hội XIV của Đảng xác định bao nhiêu nhiệm vụ trọng tâm?","options":["6 nhiệm vụ.","5 nhiệm vụ.","7 nhiệm vụ."],"correctAnswer":0},{"id":14,"question":"Quyết nghị tại Đại hội XIV của Đảng đã chỉ ra mục tiêu đến năm 2030, kỷ niệm 100 năm thành lập Đảng, Việt Nam là nước như thế nào?","options":["Là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao.","Là nước đang phát triển, có công nghiệp theo hướng hiện đại, vượt qua mức thu nhập trung bình thấp.","Trở thành nước phát triển, thu nhập cao."],"correctAnswer":0},{"id":15,"question":"Đại hội XIV của Đảng đã bầu được bao nhiêu đồng chí Ủy viên Trung ương, trong đó có bao nhiêu chính thức và bao nhiêu dự khuyết?","options":["200 đồng chí, trong đó 180 chính thức, 20 dự khuyết.","200 đồng chí, trong đó 182 chính thức, 18 dự khuyết.","200 đồng chí, trong đó 185 chính thức, 15 dự khuyết."],"correctAnswer":0},{"id":16,"question":"Có bao nhiêu đại biểu Quân đội được bầu vào Ban Chấp hành Trung ương Đảng khóa XIV?","options":["26 đại biểu.","25 đại biểu.","24 đại biểu."],"correctAnswer":0},{"id":17,"question":"Tại Hội nghị lần thứ nhất Ban Chấp hành Trung ương Đảng khóa XIV đã bầu bao nhiêu ủy viên Bộ Chính trị?","options":["19 ủy viên.","18 ủy viên.","17 ủy viên."],"correctAnswer":0},{"id":18,"question":"Quân đội Nhân dân Việt Nam có mấy chức năng, nhiệm vụ?","options":["3 chức năng, 5 nhiệm vụ.","3 chức năng, 4 nhiệm vụ.","4 chức năng, 4 nhiệm vụ."],"correctAnswer":0},{"id":19,"question":"Đại hội Đại biểu Đảng bộ Quân đội lần thứ XII diễn ra vào thời gian nào? Có bao nhiêu Đại biểu dự Đại hội?","options":["Từ ngày 29/9 đến 02/10/2025, có 450 Đại biểu.","Từ ngày 28/9 đến 01/10/2025, có 450 Đại biểu.","Từ ngày 29/9 đến 03/10/2025, có 450 Đại biểu."],"correctAnswer":0},{"id":20,"question":"Nghị quyết Đại hội đại biểu Đảng bộ Quân đội lần thứ XII, nhiệm kỳ 2025 - 2030 xác định mấy mục tiêu chủ yếu?","options":["9 mục tiêu.","8 mục tiêu.","7 mục tiêu."],"correctAnswer":0},{"id":21,"question":"Nghị quyết Đại hội đại biểu Đảng bộ Quân đội lần thứ XII, nhiệm kỳ 2025 - 2030 xác định tập trung thực hiện mấy đột phá?","options":["3 đột phá.","4 đột phá.","5 đột phá."],"correctAnswer":0},{"id":22,"question":"Phương châm Đại hội đại biểu Đảng bộ Quân đội lần thứ XII, nhiệm kỳ 2025-2030?","options":["“Đoàn kết - Dân chủ - Kỷ cương - Kiên định - Đột phá - Phát triển”.","“Đoàn kết - Kỷ cương - Kiên định - Đột phá - Phát triển”.","“Đoàn kết - Dân chủ - Kỷ cương - Đột phá - Phát triển”."],"correctAnswer":0},{"id":23,"question":"Phong trào hành động cách mạng của thanh niên Quân đội giai đoạn 2025 - 2030?","options":["“3 Tiên phong Quyết thắng”.","“Rèn đức, luyện tài, xung kích, sáng tạo, quyết thắng”","“3 xung kích Quyết thắng”."],"correctAnswer":0},{"id":24,"question":"Khẩu hiệu hành động Đại hội Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI?","options":["Thanh niên Quân đội “Bản lĩnh, tiên phong, đột phá, phát triển”.","Thanh niên Quân đội “Kiên định, trí tuệ, xung kích, quyết thắng”.","Thanh niên Quân đội “Bản lĩnh, xung kích, sáng tạo, quyết thắng”."],"correctAnswer":0},{"id":25,"question":"Ngày truyền thống của Ban Thanh niên Quân đội?","options":["08/02/1952.","08/01/1951.","08/3/1952."],"correctAnswer":0},{"id":26,"question":"Tổ chức Đoàn cơ sở trong Quân đội có mấy nhiệm vụ?","options":["5 nhiệm vụ.","4 nhiệm vụ.","6 nhiệm vụ."],"correctAnswer":0},{"id":27,"question":"Chi đoàn Thanh niên cứu quốc đầu tiên trong Quân đội được thành lập ngày, tháng, năm nào, tại đâu?","options":["Ngày 08/02/1952, tại Đại đội 29, Tiểu đoàn 183, Trung đoàn 246 (nay là Đại đội 9, Tiểu đoàn 3, Trung đoàn 246), Sư đoàn 346, Quân khu 1.","Ngày 07/02/1952, tại Đại đội 29, Tiểu đoàn 183, Trung đoàn 246 (nay là Đại đội 9, Tiểu đoàn 3, Trung đoàn 246), Sư đoàn 346, Quân khu 1.","Ngày 09/02/1952, tại Đại đội 9, Tiểu đoàn 183, Trung đoàn 246 (nay là Đại đội 9, Tiểu đoàn 3, Trung đoàn 246), Sư đoàn 346, Quân khu 1."],"correctAnswer":0},{"id":28,"question":"Hệ thống tổ chức, nhiệm vụ, quyền hạn cụ thể của tổ chức Đoàn trong Quân đội nhân dân Việt Nam do \"ai ì sự nghiệp xây dựng Việt Nam độc lập, dân chủ, giàu mạnh công bằng và văn minh theo định hướng xã hội chủ nghĩa”, đó là:","options":["Mục đích - lý tưởng của Đoàn Thanh niên Cộng sản Hồ Chí Minh.","Tính chất - chức năng của Đoàn Thanh niên Cộng sản Hồ Chí Minh.","Mục đích - vai trò của tổ chức Đoàn Thanh niên Cộng sản Hồ Chí Minh."],"correctAnswer":0},{"id":84,"question":"Trong bài nói chuyện tại Đại hội Thanh niên tích cực lao động xã hội chủ nghĩa (17/3/1960), Chủ tịch Hồ Chí Minh căn dặn thanh niên: “Phải cố gắng học hỏi để không ngừng nâng cao trình độ chính trị, văn hóa và kỹ thuật để…”. Hãy chọn đáp án đúng điền vào chỗ trống cho phù hợp?","options":["Phục vụ Tổ quốc, phục vụ nhân dân.","Phụng sự giai cấp và nhân dân.","Lao động có kỹ thuật và năng suất cao."],"correctAnswer":0},{"id":85,"question":"“Bồi dưỡng thế hệ cách mạng cho đời sau là một việc rất quan trọng và rất cần thiết”, câu nói trên được nêu trong tác phẩm nào của Chủ tịch Hồ Chí Minh?","options":["Di chúc (1969).","Thư gửi học sinh toàn quốc nhân ngày khai trường năm học mới (1945).","Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân (1969)."],"correctAnswer":0},{"id":86,"question":"Luật Thanh niên năm 2020 áp dụng cho những đối tượng nào?","options":["Thanh niên; cơ quan, tổ chức, cơ sở giáo dục, gia đình và cá nhân.","Tổ chức đoàn, cán bộ, đoàn viên, thanh niên.","Thanh niên; cơ quan, tổ chức, cán bộ, đoàn viên, thanh niên."],"correctAnswer":0},{"id":87,"question":"Luật Thanh niên 2020 có bao nhiêu chương, điều?","options":["7 chương, 41 điều.","6 chương, 40 điều.","6 chương, 41 điều."],"correctAnswer":0},{"id":88,"question":"Chức năng Câu lạc bộ Thanh niên hiện nay là gì?","options":["Giáo dục rèn luyện đoàn viên, thanh niên; tổ chức giao tiếp, ứng xử; nâng cao nhận thức, rèn luyện kỹ năng cho đoàn viên, thanh niên.","Giáo dục rèn luyện đoàn viên, thanh niên; nâng cao nhận thức, rèn luyện kỹ năng cho đoàn viên, thanh niên.","Tổ chức giao tiếp, ứng xử; nâng cao nhận thức, rèn luyện kỹ năng cho đoàn viên, thanh niên."],"correctAnswer":0},{"id":89,"question":"Cuộc cách mạng Công nghiệp lần thứ tư (hay còn gọi là Cuộc cách mạng Công nghiệp 4.0) tập trung vào công nghệ gì?","options":["Kỹ thuật số, sinh học, vật lý.","Công nghệ tin học, điện tử.","Kỹ thuật số tự động."],"correctAnswer":0},{"id":90,"question":"Điều kiện về tác giả và công trình tham gia Giải thưởng Tuổi trẻ sáng tạo trong Quân đội?","options":["Tất cả các phương án trên","Đối với tác giả, tập thể tác giả: Có công trình, là sĩ quan, quân nhân chuyên nghiệp, công chức quốc phòng, công nhân và viên chức quốc phòng, lao động hợp đồng không quá 40 tuổi (tính đến ngày 31 tháng 12 của năm xét giải), hạ sĩ quan, binh sĩ trong Quân đội; chấp hành nghiêm pháp luật của Nhà nước, kỷ luật của Quân đội; hoàn thành tốt nhiệm vụ được giao.","Đối với công trình: Đạt giá trị khoa học và thực tiễn, đã được áp dụng hoặc có khả năng áp dụng vào hoạt động thực tiễn xây dựng Quân đội và đời sống kinh tế xã hội; chưa tham gia thi cấp toàn quân, toàn quốc."],"correctAnswer":0},{"id":91,"question":"Chủ nhiệm các đề tài, sáng kiến đạt những Giải nào trong tham gia Giải thưởng TTST trong Quân đội được xem xét đề nghị cấp có thẩm quyền thăng quân hàm (đối với sĩ quan), nâng bậc lương (đối với QNCN, công chức quốc phòng, công nhân và viên chức quốc phòng) trước thời hạn 01 năm.","options":["Tất cả các phương án trên.","Giải Nhất.","Giải Nhì, Giải Ba."],"correctAnswer":0},{"id":92,"question":"Mức hỗ trợ kinh phí xây dựng Ngôi nhà 100 đồng là bao nhiêu?","options":["80 triệu đồng.","60 triệu đồng.","70 triệu đồng."],"correctAnswer":0},{"id":93,"question":"Việc giới thiệu cán bộ đơn vị Quân đội tham gia Ban Chấp hành Đoàn địa phương phải được ai đồng ý?","options":["Đảng ủy, cơ quan chính trị đơn vị.","Chính quyền địa phương.","Chỉ huy đơn vị."],"correctAnswer":0},{"id":94,"question":"Đoàn viên khi chuyển công tác phải:","options":["Chuyển sinh hoạt Đoàn qua cấp bộ Đoàn có thẩm quyền.","Không cần chuyển sinh hoạt Đoàn, chỉ nộp đoàn phí.","Chỉ báo cáo chi đoàn."],"correctAnswer":0},{"id":95,"question":"Chuyển sinh hoạt Đoàn tạm thời áp dụng với đoàn viên thay đổi nơi công tác trong thời gian nào?","options":["Dưới 3 tháng.","Từ 3 tháng đến 1 năm.","Trên 2 năm."],"correctAnswer":0},{"id":96,"question":"Trong thời gian sinh hoạt Đoàn tạm thời, đoàn viên không được thực hiện quyền nào?","options":["Ứng cử, đề cử và bầu cử cơ quan lãnh đạo Đoàn nơi sinh hoạt tạm thời.","Tham gia sinh hoạt.","Thực hiện nhiệm vụ đoàn viên."],"correctAnswer":0},{"id":97,"question":"Ban Chấp hành Đoàn cấp trung đoàn, lữ đoàn và tương đương có bao nhiêu ủy viên?","options":["9 - 15 ủy viên.","5 - 7 ủy viên.","7 - 9 ủy viên."],"correctAnswer":0},{"id":98,"question":"Ban Thường vụ Đoàn cấp trung đoàn, lữ đoàn và tương đương có bao nhiêu ủy viên?","options":["3 - 5 ủy viên.","2 - 3 ủy viên.","5 - 7 ủy viên."],"correctAnswer":0},{"id":99,"question":"Đại hội cấp chi đoàn được tổ chức?","options":["5 năm 2 lần.","1 năm 1 lần.","5 năm 1 lần."],"correctAnswer":0},{"id":100,"question":"Trong sinh hoạt chi đoàn, việc lựa chọn chủ đề gắn với nhiệm vụ huấn luyện có ý nghĩa chủ yếu nào?","options":["Tạo sự thống nhất giữa hoạt động Đoàn với nhiệm vụ trung tâm của đơn vị.","Giúp giảm thời gian quản lý đoàn viên ngoài giờ.","Giúp chi đoàn dễ đạt danh hiệu thi đua."],"correctAnswer":0},{"id":101,"question":"Chi đoàn tổ chức sinh hoạt chuyên đề về \"xây dựng chính quy, rèn luyện kỷ luật\". Nội dung nào sau đây phù hợp nhất?","options":["Phân tích thực trạng, nguyên nhân, trách nhiệm đoàn viên và đề xuất biện pháp khắc phục.","Chỉ tuyên truyền các quy định của đơn vị.","Tổng hợp danh sách đoàn viên vi phạm để báo cáo chỉ huy."],"correctAnswer":0},{"id":102,"question":"Trong điều hành sinh hoạt chi đoàn, cán bộ Đoàn cần tránh biểu hiện nào?","options":["Biến sinh hoạt chi đoàn thành buổi quán triệt mệnh lệnh của chỉ huy.","Chủ động gợi mở nội dung thảo luận.","Kết hợp giáo dục với phát huy tính tự quản của đoàn viên."],"correctAnswer":0},{"id":103,"question":"Hình thức sinh hoạt nào phù hợp nhất khi chi đoàn muốn giáo dục truyền thống, bồi dưỡng lý tưởng cho đoàn viên?","options":["Tham quan di tích lịch sử, nhà truyền thống kết hợp tọa đàm, diễn đàn.","Sinh hoạt hành chính tại phòng họp.","Hội nghị tổng kết thi đua."],"correctAnswer":0},{"id":104,"question":"Trong lễ phát động phong trào thanh niên ở đơn vị, yêu cầu cơ bản nhất là gì?","options":["Ngắn gọn, nghiêm túc, tạo khí thế thi đua và xác định rõ mục tiêu, nội dung, chỉ tiêu phong trào.","Tổ chức trang trọng, có nhiều nội dung văn nghệ tạo không khí phấn khởi.","Mời nhiều đại biểu tham dự để nâng cao ý nghĩa và tính lan tỏa của phong trào."],"correctAnswer":0},{"id":105,"question":"Việc xây dựng các tổ, đội thanh niên xung kích trong đơn vị nhằm mục đích chủ yếu nào?","options":["Xây dựng lực lượng nòng cốt, đi đầu trong thực hiện nhiệm vụ khó, khâu yếu, việc mới của đơn vị.","Tạo lực lượng thường xuyên tổ chức các hoạt động phong trào ngoài nhiệm vụ huấn luyện.","Thay thế chức năng quản lý, chỉ huy của cán bộ các cấp trong đơn vị."],"correctAnswer":0},{"id":106,"question":"Trong tổ chức sinh hoạt chi đoàn ở đơn vị, yêu cầu quan trọng nhất để nâng cao chất lượng sinh hoạt là gì?","options":["Bảo đảm tính giáo dục, tính dân chủ, tính chiến đấu và gắn với nhiệm vụ chính trị của đơn vị.","Tăng thời lượng sinh hoạt, tổ chức nhiều hoạt động phong phú để thu hút đoàn viên.","Tập trung chủ yếu vào nội dung vui chơi, giao lưu nhằm tạo không khí đoàn kết."],"correctAnswer":0},{"id":107,"question":"Trong chuẩn bị sinh hoạt chi đoàn, trách nhiệm trực tiếp phân công người chuẩn bị nội dung và điều khiển chương trình thuộc về?","options":["Ban Chấp hành chi đoàn thông qua hội nghị thống nhất phân công.","Bí thư chi đoàn sau khi xin ý kiến cấp ủy, chỉ huy đơn vị.","Cán bộ chính trị đơn vị trực tiếp xây dựng nội dung và điều hành."],"correctAnswer":0},{"id":108,"question":"Khi tổ chức sinh hoạt chi đoàn bằng hình thức hội thảo, tọa đàm, diễn đàn, cán bộ Đoàn cần thực hiện biện pháp nào để nâng cao hiệu quả?","options":["Thông báo trước chủ đề, câu hỏi định hướng để đoàn viên nghiên cứu, chuẩn bị ý kiến.","Giữ bí mật nội dung để tạo sự bất ngờ, tránh đoàn viên chuẩn bị trước.","Chỉ lựa chọn cán bộ Đoàn phát biểu nhằm bảo đảm tính chính xác của nội dung."],"correctAnswer":0},{"id":109,"question":"Trong quy trình tổ chức Đại hội Đoàn các cấp, nhiệm vụ nào sau đây thuộc trách nhiệm thường xuyên của Đại hội?","options":["Thảo luận báo cáo nhiệm kỳ trước, quyết định phương hướng nhiệm kỳ tới và bầu Ban Chấp hành mới.","Góp ý kiến vào văn kiện Đại hội Đoàn cấp trên và bầu đoàn đại biểu dự Đại hội cấp trên.","Xây dựng đề án nhân sự Ban Chấp hành khóa mới và tổ chức các tiểu ban phục vụ Đại hội."],"correctAnswer":0},{"id":110,"question":"Khi tổ chức bầu Ban Chấp hành Đoàn trong Đại hội, yêu cầu quan trọng nhất đối với cán bộ Đoàn là gì?","options":["Bảo đảm đúng nguyên tắc, thủ tục, phát huy dân chủ và lựa chọn được cán bộ đủ tiêu chuẩn.","Bảo đảm nhanh chóng hoàn thành công tác bầu cử theo chương trình đã đề ra.","Bảo đảm danh sách nhân sự dự kiến được Đại hội thống nhất thông qua."],"correctAnswer":0},{"id":111,"question":"Trong công tác phát triển đoàn viên ở đơn vị, bước đầu tiên cán bộ Đoàn cần thực hiện là gì?","options":["Tuyên truyền, giới thiệu về Đoàn thông qua các loại hình hoạt động của Đoàn, Hội, Đội.","Tổ chức lớp bồi dưỡng nhận thức về Đoàn cho thanh niên đủ điều kiện.","Lập danh sách thanh niên dự kiến kết nạp và phân công đoàn viên giúp đỡ."],"correctAnswer":0},{"id":112,"question":"Theo quy trình kết nạp đoàn viên, sau khi thanh niên được bồi dưỡng, giúp đỡ, bước tiếp theo cần thực hiện là gì?","options":["Hướng dẫn đối tượng hoàn thiện thủ tục, hồ sơ và tổ chức hội nghị chi đoàn xét kết nạp.","Tổ chức lễ kết nạp ngay để tạo động lực phấn đấu cho thanh niên.","Đề nghị cấp ủy đơn vị xem xét trước khi tổ chức kết nạp."],"correctAnswer":0},{"id":113,"question":"Trong công tác Đoàn tham gia xây dựng Đảng, nội dung quan trọng nhất của tổ chức Đoàn là gì?","options":["Giáo dục đoàn viên, bồi dưỡng đoàn viên ưu tú, giới thiệu cho Đảng xem xét kết nạp.","Thay mặt cấp ủy trực tiếp quản lý, phân công nhiệm vụ cho đảng viên trẻ.","Tổ chức các hoạt động phong trào nhằm tạo nguồn phát triển Đảng."],"correctAnswer":0},{"id":114,"question":"Khi giới thiệu đoàn viên ưu tú cho Đảng, yếu tố nào cần được xem xét trước hết?","options":["Lý lịch rõ ràng, phẩm chất chính trị, quá trình rèn luyện và tiêu chuẩn theo quy định.","Thành tích tham gia phong trào và khả năng tập hợp thanh niên.","Năng lực chuyên môn, trình độ học vấn và khả năng hoàn thành nhiệm vụ."],"correctAnswer":0},{"id":115,"question":"Trách nhiệm của tổ chức Đoàn đối với đảng viên dự bị do Đoàn giới thiệu là gì?","options":["Theo dõi, nhận xét và giao nhiệm vụ để tiếp tục rèn luyện, phát huy vai trò trong tổ chức Đoàn.","Chuyển toàn bộ trách nhiệm quản lý cho tổ chức Đảng sau khi được kết nạp.","Chỉ quản lý trong thời gian đoàn viên còn sinh hoạt Đoàn."],"correctAnswer":0},{"id":116,"question":"Trong góp ý xây dựng Đảng của tổ chức Đoàn, thái độ đúng của cán bộ, đoàn viên là gì?","options":["Góp ý trên tinh thần xây dựng, khách quan, trách nhiệm, vì sự trong sạch vững mạnh của Đảng.","Tập trung phản ánh hạn chế của cán bộ lãnh đạo để bảo đảm tính đấu tranh.","Ưu tiên góp ý những vấn đề liên quan trực tiếp đến quyền lợi đoàn viên."],"correctAnswer":0},{"id":117,"question":"Khi tổ chức góp ý kiến phê bình cán bộ, đảng viên và công tác lãnh đạo của Đảng, hình thức phù hợp ở chi đoàn là gì?","options":["Tổ chức hội nghị đoàn viên để thảo luận, góp ý và kiến nghị với cấp ủy.","Tổng hợp ý kiến cá nhân gửi trực tiếp lên cấp trên để bảo đảm khách quan.","Chỉ thực hiện thông qua Ban Chấp hành Đoàn để tránh ý kiến trái chiều."],"correctAnswer":0},{"id":118,"question":"Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI (2025 - 2030) phát động phong trào “3 Tiên phong quyết thắng”; trong đó có nội dung nào sau đây?","options":["Tiên phong phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số.","Tiên phong đổi mới sáng tạo và chuyển đổi số.","Tiên phong làm chủ khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số."],"correctAnswer":0},{"id":119,"question":"Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI (2025 - 2030) phát động phong trào “3 Tiên phong quyết thắng”; trong đó có nội dung nào sau đây?","options":["Tiên phong giữ gìn, phát huy giá trị văn hoá “Bộ đội Cụ Hồ” thời kỳ mới.","Tiên phong phát huy giá trị văn hoá “Bộ đội Cụ Hồ” thời kỳ mới.","Tiên phong giữ gìn, phát huy giá trị văn hoá “Bộ đội Cụ Hồ”."],"correctAnswer":0},{"id":120,"question":"Chương trình hành động Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI (2025 - 2030) xác định mấy đột phá?","options":["03 đột phá.","04 đột phá.","05 đột phá."],"correctAnswer":0}];
let mode='exam',exam=[],answers={},finished=false,secondsLeft=1200,elapsed=0,timerId=null;
const app=document.getElementById('app'),confirmModal=document.getElementById('confirmModal'),resultModal=document.getElementById('resultModal');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function prepare(size){return shuffle(BANK).slice(0,size).map(q=>({id:q.id,question:q.question,answers:shuffle(q.options.map((text,i)=>({text,correct:i===q.correctAnswer})))}))}
function home(){clearInterval(timerId);app.innerHTML=`<main class="home"><section class="home-card"><div class="brand"><div class="logo">✓</div><div><p class="eyebrow">HỆ THỐNG ÔN LUYỆN</p><strong>Trắc nghiệm Hoàng</strong></div></div><div class="intro"><span class="pill">Ngân hàng 120 câu hỏi</span><h1>Ôn tập tập trung.<br><span>Biết kết quả đúng lúc.</span></h1><p>Chế độ thi 40 câu công bố kết quả sau khi nộp. Chế độ ôn tập toàn bộ hiển thị đúng — sai ngay khi chọn.</p></div><div class="modes"><article class="mode"><div class="mode-head"><div class="mode-icon">◷</div><div><small>THI THỬ</small><h2>40 câu • 20 phút</h2></div></div><p>Làm và sửa đáp án trong thời gian thi; xem điểm và đối chiếu sau khi nộp.</p><button class="primary" onclick="start('exam')">Bắt đầu thi →</button></article><article class="mode blue"><div class="mode-head"><div class="mode-icon">▤</div><div><small>ÔN TẬP TOÀN BỘ</small><h2>Đủ 120 câu hỏi</h2></div></div><p>Không giới hạn thời gian, theo dõi tiến độ và xem đáp án tức thì.</p><button class="secondary" onclick="start('review')">Ôn tập ngay →</button></article></div><p class="note">Nội dung được giữ nguyên từ bộ đề đã cung cấp.</p></section></main>`}
function start(m){mode=m;exam=prepare(m==='exam'?40:BANK.length);answers={};finished=false;secondsLeft=1200;elapsed=0;clearInterval(timerId);renderExam();timerId=setInterval(()=>{if(finished)return;elapsed++;if(mode==='exam'){secondsLeft=Math.max(0,secondsLeft-1);if(secondsLeft===0){finish()}else updateHeader()}else updateHeader()},1000);scrollTo(0,0)}
function correctCount(){return exam.reduce((n,q)=>n+(answers[q.id]!=null&&q.answers[answers[q.id]].correct?1:0),0)}
function selectAnswer(id,index){if(finished||(mode==='review'&&answers[id]!=null))return;answers[id]=index;const y=scrollY;renderExam();scrollTo(0,y)}
function statsHtml(){const done=Object.keys(answers).length,unanswered=exam.length-done;if(mode==='exam'&&!finished)return `<div class="stat"><i class="dot blue-dot"></i>Đã trả lời<b>${done}</b></div><div class="stat"><i class="dot gray"></i>Chưa làm<b>${unanswered}</b></div><div class="stat"><i class="dot green"></i>Kết quả<b>Sau nộp</b></div>`;const good=correctCount();return `<div class="stat"><i class="dot green"></i>Đúng<b>${good}</b></div><div class="stat"><i class="dot red"></i>Sai<b>${done-good}</b></div><div class="stat"><i class="dot gray"></i>Chưa làm<b>${unanswered}</b></div>`}
function questionHtml(q,idx){const selected=answers[q.id],answered=selected!=null,feedback=mode==='review'?answered:finished;let result='';if(feedback){result=!answered?'<span class="result empty">Chưa trả lời</span>':q.answers[selected].correct?'<span class="result ok">✓ Chính xác</span>':'<span class="result bad">✕ Chưa đúng</span>'}const opts=q.answers.map((a,i)=>{const picked=selected===i,revealGood=feedback&&a.correct,revealBad=feedback&&picked&&!a.correct,pending=mode==='exam'&&!finished&&picked,cls=revealGood?'correct':revealBad?'wrong':pending?'selected':'';return `<button class="answer ${cls}" onclick="selectAnswer(${q.id},${i})" ${finished||(mode==='review'&&answered)?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(a.text)}</span><b>${revealGood?'✓':revealBad?'✕':''}</b></button>`}).join('');return `<article class="question"><div class="qmeta"><span class="qnum">Câu ${idx+1}</span><span class="source">Câu gốc ${q.id}</span>${result}</div><h2>${esc(q.question)}</h2><div class="answers">${opts}</div></article>`}
function renderExam(){const done=Object.keys(answers).length,pct=exam.length?done/exam.length*100:0;app.innerHTML=`<main><header class="top"><div class="top-inner"><div class="mini"><div class="logo">✓</div><div><span>TRẮC NGHIỆM</span><strong>Ôn tập Hoàng</strong></div></div><div id="timerBox" class="timer"><b>◷</b><div><small id="timerLabel"></small><strong id="timerText"></strong></div></div></div><div class="bar"><i style="width:${pct}%"></i></div></header><div class="layout"><aside class="side"><h3>TIẾN ĐỘ BÀI LÀM</h3><div class="count"><strong>${done}</strong><span> / ${exam.length} câu</span></div><div class="stats">${statsHtml()}</div><button class="primary" onclick="openConfirm()">${mode==='exam'?'Nộp bài':'Kết thúc ôn tập'}</button></aside><section><div class="heading"><div><p class="eyebrow">${mode==='exam'?(finished?'XEM LẠI BÀI THI':'BÀI THI ĐANG DIỄN RA'):'ÔN TẬP TOÀN BỘ 120 CÂU'}</p><h1>Chọn đáp án đúng nhất</h1></div><span class="answered-badge">${done}/${exam.length} đã trả lời</span></div>${exam.map(questionHtml).join('')}<div class="end"><b>⚑</b><div><strong>Bạn đã đến cuối bài</strong><span>Hãy kiểm tra số câu đã làm trước khi kết thúc.</span></div><button class="primary" onclick="openConfirm()">${mode==='exam'?'Nộp bài':'Kết thúc ôn tập'}</button></div></section></div></main>`;updateHeader()}
function updateHeader(){const box=document.getElementById('timerBox'),label=document.getElementById('timerLabel'),text=document.getElementById('timerText');if(!box)return;if(mode==='exam'){label.textContent=finished?'Bài thi đã kết thúc':'Thời gian còn lại';text.textContent=finished?fmt(elapsed):fmt(secondsLeft);box.classList.toggle('warn',!finished&&secondsLeft<=300)}else{label.textContent='Chế độ ôn tập';text.textContent='Không giới hạn'}}
function openConfirm(){if(finished)return;const done=Object.keys(answers).length;confirmModal.innerHTML=`<div class="modal-card"><h2>${mode==='exam'?'Xác nhận nộp bài?':'Kết thúc lượt ôn tập?'}</h2><p>Bạn đã trả lời ${done}/${exam.length} câu.${done<exam.length?' Còn '+(exam.length-done)+' câu chưa trả lời.':''}</p><div class="modal-actions"><button class="plain" onclick="closeConfirm()">Tiếp tục làm</button><button class="primary" onclick="finish()">${mode==='exam'?'Nộp và xem điểm':'Kết thúc và xem kết quả'}</button></div></div>`;confirmModal.classList.remove('hidden')}
function closeConfirm(){confirmModal.classList.add('hidden')}
function finish(){if(finished)return;finished=true;clearInterval(timerId);closeConfirm();renderExam();const good=correctCount(),score=(good/exam.length*10).toFixed(2);resultModal.innerHTML=`<div class="modal-card"><div class="score"><span>Điểm của bạn</span><strong>${score}</strong><small>/ 10 điểm</small></div><div class="result-grid"><div><b>${good}</b><span>Câu đúng</span></div><div><b>${exam.length-good}</b><span>Câu chưa đúng</span></div><div><b>${fmt(elapsed)}</b><span>Thời gian làm</span></div></div><div class="modal-actions"><button class="plain" onclick="reviewSubmission()">${mode==='exam'?'Xem lại bài thi':'Xem lại đáp án'}</button><button class="primary" onclick="closeResult();home()">Chọn chế độ khác</button></div></div>`;resultModal.classList.remove('hidden')}
function reviewSubmission(){closeResult();scrollTo({top:0,behavior:'smooth'})}function closeResult(){resultModal.classList.add('hidden')}
home();
</script>
</body>
</html>
