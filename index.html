<!doctype html>

<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thi trắc nghiệm</title>
  <style>
    html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#17324d}
    .loading{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:560px;width:100%;background:#fff;border:1px solid #dbe6f2;border-radius:18px;padding:32px;box-shadow:0 16px 40px rgba(26,65,105,.10);text-align:center}
    .spinner{width:42px;height:42px;border:4px solid #dbe7f4;border-top-color:#0b5ed7;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:22px;margin:0 0 10px}p{color:#60758a;line-height:1.6;margin:0}.err{color:#b42318;margin-top:14px}
  </style>
</head>
<body>
  <div class="loading"><div class="card"><div class="spinner"></div><h1>Đang tải bộ đề...</h1><p>Hệ thống đang khởi tạo bài thi 40 câu / 30 phút.</p><p id="err" class="err"></p></div></div>
  <script>
  (async()=>{
    const err=document.getElementById('err');
    try{
      if(!('DecompressionStream' in window)) throw new Error('Trình duyệt này quá cũ. Hãy dùng Chrome, Edge hoặc Firefox phiên bản mới.');
      const r=await fetch('./site.html.gz.b64',{cache:'no-store'});
      if(!r.ok) throw new Error('Không tải được dữ liệu bộ đề (HTTP '+r.status+').');
      const b64=(await r.text()).trim();
      const bin=atob(b64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const ds=new DecompressionStream('gzip');
      const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
      document.open();document.write(html);document.close();
    }catch(e){err.textContent=e.message||String(e);}
  })();
  </script>
</body>
</html>
